    <!-- agent -->
    <path d="M192 292 L192 244 Q192 222 214 218 L258 218 Q280 222 280 244 L280 292 Z" fill="#0074D9"/>
    <path d="M222 218 L236 240 L250 218 Z" fill="#EAF4FF"/>
    <rect x="228" y="200" width="16" height="22" rx="6" fill="#8D5A44"/>
    <circle cx="236" cy="180" r="27" fill="#1B2A41"/>
