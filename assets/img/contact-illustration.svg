<svg xmlns="http://www.w3.org/2000/svg" viewBox="38.0 32.2 372.0 335.8" width="372" height="336" role="img" aria-label="Customer support agent inside a phone with phone, email and 24 hour support icons" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Contact Imara IT Solutions</title>

  <!-- ground -->
  <ellipse cx="215" cy="322" rx="175" ry="44" fill="#EEF3F9"/>
  <ellipse cx="72" cy="332" rx="26" ry="9" fill="#DCE5F0"/>
  <ellipse cx="238" cy="326" rx="84" ry="10" fill="#DCE5F0"/>

  <!-- clouds -->
