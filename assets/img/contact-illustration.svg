    <ellipse cx="340" cy="62" rx="22" ry="9"/>
    <ellipse cx="354" cy="55" rx="14" ry="8"/>
    <ellipse cx="392" cy="84" rx="16" ry="6"/>
  </g>

  <!-- plant -->
  <path d="M346 318 C344 290 346 270 352 252" stroke="#0F4C8A" stroke-width="3" fill="none" stroke-linecap="round"/>
